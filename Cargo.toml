[workspace]
resolver = "3"
members = ["pcba", "pcba_cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
license = "MIT"

[workspace.dependencies]
erc_kicad = { git = "https://github.com/romixlab/better_erc" }
erc_model = { git = "https://github.com/romixlab/better_erc" }

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

[profile.deploy]
inherits = "release"
incremental = true
