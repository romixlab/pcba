[package]
name = "pcba_cli"
description = "pcba command line: board folders, assembly drawings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pcba"
path = "src/main.rs"

[dependencies]
pcba = { path = "../pcba" }
clap = { version = "4.5", features = ["derive", "color"] }
anyhow = "1.0"
prompted = "0.2"
convert_case = "0.8"
pest = "2.8"
pest_derive = "2.8"
chardetng = "1.0"
encoding_rs = { version = "0.8", features = ["alloc"] }
lexpr = "0.2"
